<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Queral</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon-180x180.png">
    <link rel="manifest" href="assets/images/site.webmanifest">
    <link rel="stylesheet" href="assets/css/tachyons-base.css" />
    <link rel="stylesheet" href="assets/css/custom.css" />
    <style>
        #random-logo {
            outline: none !important;
        }
        #random-logo:focus {
            outline: none !important;
        }
        .logo-header {
            border: 6px solid #000;
            cursor: pointer;
            transition: box-shadow 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .logo-header:hover {
            border-color: var(--hover-border-color, #000);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .logo-header:active {
            border-color: var(--active-border-color, #000);
        }
    </style>
</head>
<body class="sans-serif bg-light-gray">
    <div class="mw7 center pa3 pa4-ns">
        <header class="mb3 flex justify-center">
            <nav class="flex flex-wrap justify-center">
                <a href="index.html" class="link gray hover-near-black underline-hover f6 f4-ns ph2 ph3-ns pv1 pv2-ns br3 mr2 mr3-ns mb2">studio log</a>
                <a href="projects.html" class="link gray hover-near-black underline-hover f6 f4-ns ph2 ph3-ns pv1 pv2-ns br3 mr2 mr3-ns mb2">projects</a>
                <a href="about.html" class="link gray hover-near-black underline-hover f4 f4-ns ph2 ph3-ns pv1 pv2-ns br3 mr0 mb2">about</a>
            </nav>
        </header>
        
        <header class="logo-header tc mw7 center mb3 br2" style="padding: clamp(2rem, 8vw, 5rem);" onclick="window.location.reload();" id="logo-header">
            <h1 class="ma0 lh-solid" style="font-size: clamp(3rem, 12vw, 10rem);">
                <span class="link no-underline" id="random-logo">
                    <span>S</span><span>t</span><span>u</span><span>d</span><span>i</span><span>o</span><br><span>Q</span><span>u</span><span>e</span><span>r</span><span>A</span><span>l</span>
                </span>
            </h1>
        </header>
        
        <main class="tc">
            <div class="measure-wide tl center">
                <p class="f6 f4-ns near-black lh-copy mb4 mb3-ns">
                    This is the personal website of <a href="about.html" class="link gray hover-near-black underline-hover">Luis Queral</a>.
                </p>

                <p class="f6 f4-ns near-black lh-copy">
                    He is a <a href="projects.html" class="link gray hover-near-black underline-hover">software designer</a>, <a href="projects.html" class="link gray hover-near-black underline-hover">hypermedia artist</a>, and <a href="about.html" class="link gray hover-near-black underline-hover">researcher</a> who leads <a href="#" class="link gray hover-near-black underline-hover">generative design</a> at The New York Times.
                </p>
            </div>
        </main>
    </div>
    
    <script>
        function generateRandomColors() {
            // Generate random light background color
            const hue = Math.floor(Math.random() * 360);
            const saturation = Math.floor(Math.random() * 30) + 10; // 10-40% saturation
            const lightness = Math.floor(Math.random() * 15) + 85; // 85-100% lightness
            
            const backgroundColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
            const borderColor = `hsl(${hue}, ${saturation + 15}%, ${lightness - 15}%)`;
            const hoverBorderColor = `hsl(${hue}, ${saturation + 20}%, ${lightness - 25}%)`;
            const activeBorderColor = `hsl(${hue}, ${saturation + 30}%, ${lightness - 35}%)`;
            
            // Calculate contrasting text color
            const textLightness = lightness > 90 ? 20 : 30; // Darker text for lighter backgrounds
            const textColor = `hsl(${hue}, ${saturation + 10}%, ${textLightness}%)`;
            
            return { backgroundColor, borderColor, hoverBorderColor, activeBorderColor, textColor };
        }
        
        function applyRandomization() {
            // Random logo font assignment
            const fonts = [
                'font-comic', 'font-blackletter', 'font-times', 'font-helvetica-bold', 'font-galapagos'
            ];
            
            const logoSpans = document.querySelectorAll('#random-logo span');
            logoSpans.forEach((span, index) => {
                const randomFont = fonts[Math.floor(Math.random() * fonts.length)];
                span.className = randomFont;
                
                // Randomly choose uppercase or lowercase for the first letter "S"
                if (index === 0) {
                    span.textContent = Math.random() < 0.5 ? 'S' : 's';
                }
            });
            
            // Random background and border colors
            const colors = generateRandomColors();
            const header = document.getElementById('logo-header');
            const logo = document.getElementById('random-logo');
            
            header.style.backgroundColor = colors.backgroundColor;
            header.style.borderColor = colors.borderColor;
            logo.style.color = colors.textColor;
            
            // Update CSS custom properties for hover/active states
            document.documentElement.style.setProperty('--hover-border-color', colors.hoverBorderColor);
            document.documentElement.style.setProperty('--active-border-color', colors.activeBorderColor);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            applyRandomization();
        });
        
        // Apply full randomization on click
        document.getElementById('logo-header').onclick = function() {
            applyRandomization();
        };
    </script>
</body>
</html>
