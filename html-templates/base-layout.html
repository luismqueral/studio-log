<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body class="sans-serif bg-light-gray">
    <div class="mw7 center pa4">
        <header class="mb5 flex items-center justify-between">
            <h1 class="f3 ma0">
                <a href="/" class="link black hover-blue underline-hover" id="random-logo">
                    <span>s</span><span>t</span><span>u</span><span>d</span><span>i</span><span>o</span><span> </span><span>q</span><span>u</span><span>e</span><span>r</span><span>a</span><span>l</span>
                </a>
            </h1>
            <nav>
                <a href="/studio-log" class="link gray hover-blue underline-hover mr4">studio log</a>
                <a href="/about" class="link gray hover-blue underline-hover mr4">about</a>
                <a href="/projects" class="link gray hover-blue underline-hover mr4">projects</a>
                <a href="/contact" class="link gray hover-blue underline-hover">contact</a>
            </nav>
        </header>
        
        <main>
            <!-- Page content goes here -->
        </main>
    </div>
    
    <script>
        // Random logo font assignment
        document.addEventListener('DOMContentLoaded', function() {
            const fonts = [
                'font-times', 'font-georgia', 'font-baskerville', 'font-arial', 
                'font-helvetica', 'font-futura', 'font-avenir', 'font-courier', 
                'font-monaco', 'font-menlo', 'font-impact', 'font-trebuchet', 
                'font-optima', 'font-palatino', 'font-lucida'
            ];
            
            const logoSpans = document.querySelectorAll('#random-logo span');
            logoSpans.forEach(span => {
                const randomFont = fonts[Math.floor(Math.random() * fonts.length)];
                span.className = randomFont;
            });
        });
    </script>
</body>
</html>
