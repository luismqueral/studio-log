<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags - Studio Log</title>
    <link rel="stylesheet" href="assets/css/tachyons-base.css" />
    <link rel="stylesheet" href="assets/css/custom.css" />
</head>
<body class="sans-serif bg-light-gray">
    <div class="mw7 center pa4">
        <header class="mb5">
            <h1 class="f2 ma0">
                <a href="/" class="link black hover-blue hover-underline">
                    Studio Log
                </a>
            </h1>
            <p class="f5 gray mt2 mb0">
                Notes on software making, generative art, assorted projects, and the things that inspire me.
            </p>
        </header>
        
        <main>
            <div class="pa4 bg-white">
                <div class="mb4">
                    <a href="/" class="link blue hover-dark-blue hover-underline">← Back to all posts</a>
                </div>
                
                <header class="mb5">
                    <h1 class="f2 mb2">Tags</h1>
                    <p class="f5 gray">
                        8 tags across 12 posts
                    </p>
                </header>
                
                <div class="tag-cloud">
                    <a href="/tags/obsidian" class="link dark-gray hover-blue hover-underline dib mr4 mb3 f4">
                        #obsidian <span class="f6 gray">(4)</span>
                    </a>
                    
                    <a href="/tags/generative-art" class="link dark-gray hover-blue hover-underline dib mr4 mb3 f4">
                        #generative-art <span class="f6 gray">(3)</span>
                    </a>
                    
                    <a href="/tags/creative-tools" class="link dark-gray hover-blue hover-underline dib mr4 mb3 f4">
                        #creative-tools <span class="f6 gray">(3)</span>
                    </a>
                    
                    <a href="/tags/games" class="link dark-gray hover-blue hover-underline dib mr4 mb3 f4">
                        #games <span class="f6 gray">(2)</span>
                    </a>
                    
                    <a href="/tags/writing" class="link dark-gray hover-blue hover-underline dib mr4 mb3 f4">
                        #writing <span class="f6 gray">(2)</span>
                    </a>
                    
                    <a href="/tags/nextjs" class="link dark-gray hover-blue hover-underline dib mr4 mb3 f4">
                        #nextjs <span class="f6 gray">(1)</span>
                    </a>
                    
                    <a href="/tags/cursor" class="link dark-gray hover-blue hover-underline dib mr4 mb3 f4">
                        #cursor <span class="f6 gray">(1)</span>
                    </a>
                    
                    <a href="/tags/vercel" class="link dark-gray hover-blue hover-underline dib mr4 mb3 f4">
                        #vercel <span class="f6 gray">(1)</span>
                    </a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
